; ReBIOS's configuration on the ReBIOS USB stick, read from the stick's
; EFI\BOOT directory. README.md in ReBIOS's sources lists every setting.

; The stick holds no legacy operating system, so ReBIOS boots the computer's
; other drives, those with something to boot first: internal drives, then
; CDs and DVDs, then other USB drives. To boot a particular drive instead,
; give part of its model name or its UEFI device path, as ReBIOS lists them
; at startup with verbose = true. The legacy BIOS's boot menu, on Esc, picks
; any drive for one boot.
boot_drive = auto

; Show ReBIOS's messages, among them the list of drives, while it starts.
;verbose = true
