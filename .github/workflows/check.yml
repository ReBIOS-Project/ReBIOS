name: Check for compilation failures

on: [push, pull_request]

jobs:
  build:
    name: Check for compilation failures
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman --noconfirm -Syu && pacman --needed --noconfirm -S base-devel git nodejs python llvm clang lld

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get the dependencies
        run: ./get-deps

      - name: Build ReBIOS (GNU, default)
        run: make all -j$(nproc) CFLAGS='-g -O2 -pipe -Werror' VGABIOS_CFLAGS='-g -O2 -pipe -Werror' && make clean

      - name: Build ReBIOS (LLVM)
        run: make all -j$(nproc) TOOLCHAIN=llvm CFLAGS='-g -O2 -pipe -Werror' VGABIOS_CFLAGS='-g -O2 -pipe -Werror' && make clean
